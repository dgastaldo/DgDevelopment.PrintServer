name: 07 - Publish docs

# Publishes the docs/ folder (Markdown rendered by Jekyll) to GitHub Pages whenever the docs branch
# changes, including any OpenAPI JSON placed in docs/openapi/. One-time setup: Settings > Pages >
# Source: GitHub Actions, and allow the docs branch in the github-pages Environment's deployment
# branches.

on:
  push:
    branches: [docs]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
