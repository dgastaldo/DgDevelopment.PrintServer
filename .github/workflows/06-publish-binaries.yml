name: 06 - Publish binaries

# Fires when release-please's Release PR is merged (that merge creates the server-vX.Y.Z tag and its
# GitHub Release). Builds the self-contained binaries for every platform and attaches them, with
# SHA256SUMS, to that release.

on:
  push:
    tags: ['server-v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-binaries.yml
    with:
      ref: ${{ github.ref_name }}

  release:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Attach binaries to the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi
