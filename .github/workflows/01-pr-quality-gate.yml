name: 01 - PR Quality Gate

# Runs on every PR into develop. The required status checks are build-test (one per OS: Linux and
# Windows; macOS runs only after the merge, in 03-develop-quality-gate.yml, because GitHub's macOS
# runners are often not assigned for a long time and would block merges) and dependency-audit.
# dependency-audit uses only tools that ship with the SDK and with Node (dotnet list package
# --vulnerable and npm audit), so it needs no account, token or quota - this is the repo's one and
# only vulnerability gate now. Snyk was dropped entirely (not just made optional): its free tier
# caps at 200 tests/month, which a required-adjacent job burns through fast for no benefit over
# dependency-audit's own CVE coverage against the same NuGet/npm advisory databases. sonar is a
# separate, still-optional extra (code quality/coverage, not vulnerabilities) that never blocks
# the PR and authenticates to SonarQube Cloud via secretless OIDC - no token to manage.
#
# Optional variables: SONAR_PROJECT_KEY (defaults to <owner>_<repo>; set it so a repository rename
# cannot move the analysis to a different SonarCloud project). Requires an org admin to enable
# "Secretless analysis for GitHub Actions" once in SonarQube Cloud's organization settings.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PrintServer.slnx

      - name: Build
        run: dotnet build PrintServer.slnx --no-restore -warnaserror

      - name: Test with coverage
        run: dotnet test PrintServer.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Enforce coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          THRESHOLD: '0.80'
        run: |
          COVERAGE_FILE=$(find TestResults -name coverage.cobertura.xml | head -1)
          LINE_RATE=$(grep -oP '(?<=line-rate=")[^"]+' "$COVERAGE_FILE" | head -1)
          awk -v rate="$LINE_RATE" -v threshold="$THRESHOLD" 'BEGIN { exit (rate < threshold) }' \
            || { echo "Line coverage $LINE_RATE is below the $THRESHOLD threshold"; exit 1; }

      - name: Check NuGet licenses
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global nuget-license
          nuget-license --input PrintServer.slnx --allowed-license-types allowed-licenses.json --licenseurl-to-license-mappings license-url-mappings.json --include-transitive

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PrintServer.slnx

      - name: Fail on vulnerable NuGet packages (direct and transitive)
        shell: bash
        run: |
          dotnet list PrintServer.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.txt
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "::error::Vulnerable NuGet packages found, see the log above"
            exit 1
          fi
          if grep -q "NU1900" vulnerabilities.txt; then
            echo "::error::Could not retrieve NuGet vulnerability data"
            exit 1
          fi

      - name: Fail on high or critical npm vulnerabilities
        shell: bash
        run: |
          status=0
          while IFS= read -r lock; do
            dir=$(dirname "$lock")
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --audit-level=high) || status=1
            echo "::endgroup::"
          done < <(find . -name package-lock.json -not -path "*/node_modules/*")
          exit $status

  sonar:
    runs-on: ubuntu-latest
    continue-on-error: true # optional extra - never blocks the PR
    permissions:
      contents: read
      id-token: write # secretless SonarQube Cloud auth below - exchanges this for a 30min token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to SonarQube Cloud
        id: sonar_auth
        uses: SonarSource/sonarqube-auth-action@v1
        with:
          export-env: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ steps.sonar_auth.outputs.project-key }}"
          /o:"${{ steps.sonar_auth.outputs.organization }}"
          /d:sonar.token="${{ steps.sonar_auth.outputs.sonar-token }}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**"
          /d:sonar.coverage.exclusions="src/PrintServer.Host/Program.cs"

      - name: Build and test
        run: |
          dotnet build PrintServer.slnx
          dotnet test PrintServer.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ steps.sonar_auth.outputs.sonar-token }}"
