name: 01 - PR Quality Gate

# Runs on every PR into develop. The required status checks are build-test (one per OS: Linux and
# Windows; macOS runs only after the merge, in 03-develop-quality-gate.yml, because GitHub's macOS
# runners are often not assigned for a long time and would block merges) and dependency-audit.
# dependency-audit uses only tools that ship with the SDK and with Node (dotnet list package
# --vulnerable and npm audit), so it needs no account, token or quota. sonar is an optional extra
# that skips itself when SONAR_TOKEN is not available (PRs from forks and Dependabot do not
# receive repository secrets).
#
# Optional secret: SONAR_TOKEN. Optional variables: SONAR_ORGANIZATION and SONAR_PROJECT_KEY
# (defaults to <owner>_<repo>; set it so a repository rename cannot move the analysis to a
# different SonarCloud project).

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PrintServer.slnx

      - name: Build
        run: dotnet build PrintServer.slnx --no-restore -warnaserror

      - name: Test with coverage
        run: dotnet test PrintServer.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Enforce coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          THRESHOLD: '0.80'
        run: |
          COVERAGE_FILE=$(find TestResults -name coverage.cobertura.xml | head -1)
          LINE_RATE=$(grep -oP '(?<=line-rate=")[^"]+' "$COVERAGE_FILE" | head -1)
          awk -v rate="$LINE_RATE" -v threshold="$THRESHOLD" 'BEGIN { exit (rate < threshold) }' \
            || { echo "Line coverage $LINE_RATE is below the $THRESHOLD threshold"; exit 1; }

      - name: Check NuGet licenses
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global nuget-license
          nuget-license --input PrintServer.slnx --allowed-license-types allowed-licenses.json --licenseurl-to-license-mappings license-url-mappings.json --include-transitive

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PrintServer.slnx

      - name: Fail on vulnerable NuGet packages (direct and transitive)
        shell: bash
        run: |
          dotnet list PrintServer.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.txt
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "::error::Vulnerable NuGet packages found, see the log above"
            exit 1
          fi
          if grep -q "NU1900" vulnerabilities.txt; then
            echo "::error::Could not retrieve NuGet vulnerability data"
            exit 1
          fi

      - name: Fail on high or critical npm vulnerabilities
        shell: bash
        run: |
          status=0
          while IFS= read -r lock; do
            dir=$(dirname "$lock")
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --audit-level=high) || status=1
            echo "::endgroup::"
          done < <(find . -name package-lock.json -not -path "*/node_modules/*")
          exit $status

  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Setup .NET
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install SonarScanner for .NET
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**"
          /d:sonar.coverage.exclusions="src/PrintServer.Host/Program.cs"

      - name: Build and test
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet build PrintServer.slnx
          dotnet test PrintServer.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
