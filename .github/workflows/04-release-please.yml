name: 04 - release-please

# Maintains a standing Release PR from the Conventional Commits merged into develop. Merging it
# creates the server-vX.Y.Z tag. That tag only marks the version: it publishes nothing. Each
# environment's release is created when a promotion reaches its branch (see 05-promote.yml).

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.PROMOTE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
