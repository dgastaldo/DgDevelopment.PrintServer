name: 03 - Develop Quality Gate

# Runs on every merge into develop: build and tests on all three platforms, plus a smoke test of the
# published self-contained binary (start it, call /health). The sonar job gives SonarCloud a real
# branch analysis for develop and authenticates via secretless OIDC (no SONAR_TOKEN to manage).
#
# macOS is optional: it is its own job (build-test-macos), not part of the build-test matrix, so that
# smoke-test (which needs build-test) never waits for it. GitHub's macOS runners are often not
# assigned for a long time; when that happens, or when the job fails, nothing else is blocked.

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PrintServer.slnx

      - name: Build
        run: dotnet build PrintServer.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test PrintServer.slnx --no-build

  build-test-macos:
    name: build-test (macos-latest)
    runs-on: macos-latest
    continue-on-error: true # optional - never blocks smoke-test, the promotion or the workflow result
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PrintServer.slnx

      - name: Build
        run: dotnet build PrintServer.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test PrintServer.slnx --no-build

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish src/PrintServer.Host/PrintServer.Host.csproj
          -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Start the binary with the watcher and the queue enabled and call /health
        run: |
          mkdir -p "$RUNNER_TEMP/inbox"
          ASPNETCORE_URLS=http://127.0.0.1:5088 Watcher__Path="$RUNNER_TEMP/inbox" Queue__DatabasePath="$RUNNER_TEMP/queue.db" ./publish/PrintServer.Host &
          PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5088/health; then
              kill $PID
              test -f "$RUNNER_TEMP/queue.db" || { echo "The queue database was not created"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          kill $PID
          exit 1

  sonar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # secretless SonarQube Cloud auth below - exchanges this for a 30min token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to SonarQube Cloud
        id: sonar_auth
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82 # v1.1.0
        with:
          export-env: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ steps.sonar_auth.outputs.project-key }}"
          /o:"${{ steps.sonar_auth.outputs.organization }}"
          /d:sonar.token="${{ steps.sonar_auth.outputs.sonar-token }}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**"
          /d:sonar.coverage.exclusions="src/PrintServer.Host/Program.cs"

      - name: Build and test
        run: |
          dotnet build PrintServer.slnx
          dotnet test PrintServer.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ steps.sonar_auth.outputs.sonar-token }}"
