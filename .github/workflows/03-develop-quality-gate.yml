name: 03 - Develop Quality Gate

# Runs on every merge into develop: build and tests on all three platforms, plus a smoke test of the
# published self-contained binary (start it, call /health). The sonar job gives SonarCloud a real
# branch analysis for develop and skips itself when SONAR_TOKEN is not set.

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PrintServer.slnx

      - name: Build
        run: dotnet build PrintServer.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test PrintServer.slnx --no-build

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained single-file binary
        run: >
          dotnet publish src/PrintServer.Host/PrintServer.Host.csproj
          -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Start the binary and call /health
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5088 ./publish/PrintServer.Host &
          PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5088/health; then kill $PID; exit 0; fi
            sleep 1
          done
          kill $PID
          exit 1

  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Setup .NET
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install SonarScanner for .NET
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}"
          /o:"${{ vars.SONAR_ORGANIZATION }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/Migrations/**"
          /d:sonar.coverage.exclusions="src/PrintServer.Host/Program.cs"

      - name: Build and test
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet build PrintServer.slnx
          dotnet test PrintServer.slnx --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
