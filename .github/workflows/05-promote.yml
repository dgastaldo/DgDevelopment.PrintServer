name: 05 - Promote

# Fires when a PR is merged into develop, personal, docs, integration, or main.
#
# develop: opens (or reuses, when one is already open) the promotion PR develop -> personal. No tag
# is created on develop: its versions are marked by release-please's server-vX.Y.Z tags. Merging
# that PR is still a deliberate human action.
#
# personal, docs, integration, main: two effects:
#   1. Auto-creates and pushes that branch's release tag, which is what actually triggers that
#      environment's release workflow. The tag carries the version release-please keeps in
#      .release-please-manifest.json at the merged commit: personal/vX.Y.Z, docs/vX.Y.Z,
#      integration/vX.Y.Z and vX.Y.Z on main. When that tag already exists (a new promotion that
#      carries no new release-please version) the run number is appended as build metadata,
#      e.g. personal/vX.Y.Z+42. See BRANCHING.md.
#   2. If there's a next branch in the chain, opens the promotion PR toward it - the actual merge
#      of *that* PR is still a deliberate human action (the promotion approval gate).
#
# IMPORTANT: tags/PRs created with the default GITHUB_TOKEN do not themselves trigger other
# workflows (GitHub's anti-recursion safeguard), so the tag-push step below needs a real PAT
# (repository secret PROMOTE_PAT, minimally scoped to Contents: write + Pull requests: write on
# this repo) instead of secrets.GITHUB_TOKEN - otherwise pushing e.g. a personal/v* tag would
# never actually fire deploy-personal.yml.

on:
  pull_request:
    types: [closed]
    branches: [develop, personal, docs, integration, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_PAT }}

      - name: Compute this branch's tag prefix and the next branch in the chain
        id: vars
        run: |
          case "${{ github.base_ref }}" in
            develop)     prefix="";              next="personal" ;;
            personal)    prefix="personal/v";    next="docs" ;;
            docs)        prefix="docs/v";        next="integration" ;;
            integration) prefix="integration/v"; next="main" ;;
            main)        prefix="v";             next="" ;;
            *)           echo "Unsupported base branch ${{ github.base_ref }}" >&2; exit 1 ;;
          esac
          tag=""
          if [[ -n "${prefix}" ]]; then
            version="$(jq -r '.["."]' .release-please-manifest.json)"
            tag="${prefix}${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              tag="${tag}+${{ github.run_number }}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push the release tag
        if: steps.vars.outputs.tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Open the next promotion PR
        if: steps.vars.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_PAT }}
          BASE: ${{ github.base_ref }}
          NEXT: ${{ steps.vars.outputs.next }}
          TAG: ${{ steps.vars.outputs.tag }}
          MERGED_PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$(gh pr list --base "$NEXT" --head "$BASE" --state open --json number --jq length)" != "0" ]]; then
            echo "A promotion PR $BASE -> $NEXT is already open."
            exit 0
          fi
          if [[ -n "$TAG" ]]; then
            body="Automated promotion PR, opened after \`$BASE\` was tagged \`$TAG\`."
          else
            body="Automated promotion PR, opened after #$MERGED_PR was merged into \`$BASE\`. Merge it with a merge commit, not a squash."
          fi
          gh pr create --base "$NEXT" --head "$BASE" --title "Promote $BASE → $NEXT" --body "$body"
